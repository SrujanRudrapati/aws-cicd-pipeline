version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/live
    schedule:
      interval: weekly
