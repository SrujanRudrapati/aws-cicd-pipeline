# Local stack: the app plus Postgres, mirroring the EC2 + RDS tiers.
#   make up    ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        APP_VERSION: local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app-local-only
      DB_SSLMODE: disable
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      db:
        condition: service_healthy
